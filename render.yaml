services:
  - type: web
    # Keep this equal to the service name shown in your Render dashboard. Changing it here makes Render
    # create a NEW service (new URL) instead of renaming the existing one. Rename in the dashboard instead.
    name: agrisense-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPERATOR_NAME
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
